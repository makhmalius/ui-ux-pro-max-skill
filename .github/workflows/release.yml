name: Release

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    if: github.repository == 'nextlevelbuilder/ui-ux-pro-max-skill'

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: cli
        run: npx playwright install --with-deps chromium

      - name: Run aggregate offline data gate
        run: npm --prefix cli run verify:data

      - name: Build CLI
        working-directory: cli
        run: npm run build

      - name: Run CLI end-to-end regression tests
        working-directory: cli
        run: npx playwright test

      - name: Install gallery dependencies
        working-directory: gallery
        run: npm ci

      - name: Test and build gallery
        working-directory: gallery
        run: |
          npm test
          npm run build

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npx --yes \
            -p semantic-release@25.0.9 \
            -p @semantic-release/commit-analyzer@13.0.1 \
            -p @semantic-release/release-notes-generator@14.1.1 \
            -p @semantic-release/npm@13.2.0 \
            -p @semantic-release/github@12.0.10 \
            -p conventional-changelog-conventionalcommits@10.4.1 \
            semantic-release
